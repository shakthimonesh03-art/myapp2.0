version: '3.8'

services:
  auth:
    build:
      context: ./services/auth
    image: <your-aws-account-id>.dkr.ecr.<your-region>.amazonaws.com/auth:latest
    ports:
      - "3001:3000"

  users:
    build:
      context: ./services/users
    image: <your-aws-account-id>.dkr.ecr.<your-region>.amazonaws.com/users:latest
    ports:
      - "3002:3000"

  bookings:
    build:
      context: ./services/bookings
    image: <your-aws-account-id>.dkr.ecr.<your-region>.amazonaws.com/bookings:latest
    ports:
      - "3003:3000"

  payments:
    build:
      context: ./services/payments
    image: <your-aws-account-id>.dkr.ecr.<your-region>.amazonaws.com/payments:latest
    ports:
      - "3004:3000"

  notifications:
    build:
      context: ./services/notifications
    image: <your-aws-account-id>.dkr.ecr.<your-region>.amazonaws.com/notifications:latest
    ports:
      - "3005:3000"